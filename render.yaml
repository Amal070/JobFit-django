services:
  # ---------------------------------------------------------------------------
  # Backend Web Service (Django + Gunicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: jobfit-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobfit-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://jobfit-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React Router 7 SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: jobfit-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: build/client
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://jobfit-backend-g1i5.onrender.com/api"

databases:
  # ---------------------------------------------------------------------------
  # Production PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: jobfit-db
    plan: free
    databaseName: jobfit
    user: jobfit_user
